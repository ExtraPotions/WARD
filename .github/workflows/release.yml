name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          npm run release:check
          grep -q "^// @version[[:space:]]*$version$" ward.user.js
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          awk '
            /^## / { section += 1; if (section > 1) exit }
            { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$TAG" \
            ward.user.js \
            assets/ward-launcher.svg \
            --title "WARD $TAG" \
            --notes-file release-notes.md
