name: Verify userscript
on: [push, pull_request, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Core rollout preparer
        run: node --check scripts/prepare-core-release.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify pinned exp-core
        run: node scripts/verify-exp-core-pin.cjs
