name: Verify userscript
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Core rollout preparer
        run: node --check scripts/prepare-core-release.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify pinned exp-core
        run: node scripts/verify-exp-core-pin.cjs
